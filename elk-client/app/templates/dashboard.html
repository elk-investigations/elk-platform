<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Cases — ELK Client Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap">
<style>
  :root {
    --navy:    #091422;
    --navy-2:  #0D1E35;
    --navy-3:  #122544;
    --navy-4:  #162D50;
    --teal:    #4DC9A7;
    --teal-lt: rgba(77,201,167,.14);
    --gold:    #D4A843;
    --gold-lt: rgba(212,168,67,.13);
    --red-lt:  rgba(239,68,68,.13);
    --text-1:  #F0EDE6;
    --text-2:  #C4D0E4;
    --text-3:  #7A9ABB;
    --text-4:  #4A6A8A;
    --line:    rgba(77,201,167,.16);
    --line-2:  rgba(255,255,255,.06);
    --radius:  6px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 16px;
    background: var(--navy);
    color: var(--text-1);
    min-height: 100vh;
  }

  /* ── Top navigation ── */
  .topbar {
    background: var(--navy-2);
    border-bottom: 1px solid var(--line);
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    color: inherit;
    cursor: pointer;
  }
  .topbar-logo:hover .firm { color: var(--teal); }
  .logo-mark {
    width: 40px; height: 40px;
    background: var(--teal-lt);
    border: 1px solid rgba(77,201,167,.35);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: .95rem;
    font-weight: 700;
    color: var(--teal);
    letter-spacing: -.02em;
  }
  .logo-text .firm { font-size: .95rem; font-weight: 700; color: var(--text-1); line-height: 1.2; }
  .logo-text .sub  { font-size: .65rem; letter-spacing: .16em; text-transform: uppercase; color: var(--teal); }
  .topbar-right { display: flex; align-items: center; gap: 20px; }
  .greeting { font-size: .9rem; color: var(--text-2); }
  .greeting strong { color: var(--text-1); font-weight: 600; }
  .btn-logout {
    padding: 8px 18px;
    background: transparent;
    border: 1px solid var(--line-2);
    border-radius: var(--radius);
    color: var(--text-3);
    font-size: .82rem;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: border-color .2s, color .2s;
  }
  .btn-logout:hover { border-color: var(--text-3); color: var(--text-2); }

  /* ── Page ── */
  .page { max-width: 960px; margin: 0 auto; padding: 44px 32px 80px; }

  .page-hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 40px;
  }
  .page-hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 6px;
  }
  .page-hero p { font-size: .95rem; color: var(--text-3); }

  .btn-new-case {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: var(--teal);
    border: none;
    border-radius: var(--radius);
    color: var(--navy);
    font-size: .9rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    text-decoration: none;
    white-space: nowrap;
    transition: opacity .2s;
  }
  .btn-new-case:hover { opacity: .9; }
  .btn-new-case svg { width: 16px; height: 16px; }

  /* ── Summary row ── */
  .summary-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    margin-bottom: 36px;
  }
  .summary-card {
    background: var(--navy-2);
    border: 1px solid var(--line-2);
    border-radius: 8px;
    padding: 20px 22px;
  }
  .summary-label {
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text-4);
    margin-bottom: 8px;
  }
  .summary-value {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--text-1);
    line-height: 1;
  }
  .summary-value.teal { color: var(--teal); }
  .summary-value.gold { color: var(--gold); }

  /* ── Section label ── */
  .section-label {
    font-size: .75rem;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--text-4);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line-2);
  }

  /* ── Case cards ── */
  .cases-list { display: flex; flex-direction: column; gap: 14px; }

  .case-card {
    background: var(--navy-2);
    border: 1px solid var(--line-2);
    border-radius: 10px;
    padding: 24px 28px;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px 24px;
    align-items: start;
  }
  .case-card:hover {
    border-color: rgba(77,201,167,.35);
    background: var(--navy-3);
  }
  .case-card.has-action { border-left: 3px solid var(--gold); }

  .case-num {
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 5px;
  }
  .case-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text-1);
    margin-bottom: 10px;
  }
  .case-meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    font-size: .82rem;
    color: var(--text-3);
    margin-bottom: 14px;
  }
  .case-meta-row span { display: flex; align-items: center; gap: 5px; }

  .case-update-preview {
    font-size: .88rem;
    color: var(--text-2);
    line-height: 1.6;
    background: var(--navy-3);
    border-left: 2px solid var(--line);
    padding: 10px 14px;
    border-radius: 0 var(--radius) var(--radius) 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .update-prefix {
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text-4);
    display: block;
    margin-bottom: 4px;
  }

  /* Badges */
  .badge {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .badge-active   { background: var(--teal-lt);  color: var(--teal); }
  .badge-intake   { background: var(--gold-lt);  color: var(--gold); }
  .badge-signed   { background: var(--teal-lt);  color: var(--teal); }
  .badge-closed   { background: rgba(255,255,255,.06); color: var(--text-4); }
  .badge-pending  { background: var(--gold-lt);  color: var(--gold); }
  .badge-action   { background: var(--gold-lt);  color: var(--gold); }

  .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .action-alert {
    font-size: .72rem;
    font-weight: 600;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* ── Empty state ── */
  .empty {
    background: var(--navy-2);
    border: 1px dashed rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 64px 32px;
    text-align: center;
  }
  .empty-icon { font-size: 2.4rem; margin-bottom: 16px; }
  .empty h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    margin-bottom: 8px;
  }
  .empty p { color: var(--text-3); font-size: .95rem; margin-bottom: 28px; }

  /* ── Detail slide panel ── */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(9,20,34,.65);
    backdrop-filter: blur(2px);
    z-index: 200;
  }
  .panel {
    display: none;
    position: fixed;
    top: 0; right: 0;
    width: min(520px, 100vw);
    height: 100%;
    background: var(--navy-2);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    z-index: 201;
    flex-direction: column;
  }
  .panel.open { display: flex; }
  .panel-head {
    position: sticky; top: 0;
    background: var(--navy-2);
    border-bottom: 1px solid var(--line-2);
    padding: 22px 28px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }
  .panel-head-num {
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 4px;
  }
  .panel-head-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 600;
  }
  .btn-close {
    background: none; border: none; cursor: pointer; color: var(--text-3);
    padding: 4px; line-height: 1; flex-shrink: 0;
  }
  .btn-close:hover { color: var(--text-1); }

  .panel-body { padding: 28px; flex: 1; }

  .p-section { margin-bottom: 32px; }
  .p-sec-title {
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--text-4);
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line-2);
    margin-bottom: 16px;
  }

  /* Status line */
  .status-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  /* Action cards */
  .action-card {
    background: var(--navy-3);
    border: 1px solid rgba(212,168,67,.25);
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 12px;
  }
  .action-card h4 { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
  .action-card p  { font-size: .88rem; color: var(--text-2); line-height: 1.6; margin-bottom: 14px; }
  .action-btns { display: flex; gap: 10px; }
  .btn-approve {
    padding: 9px 20px;
    background: var(--teal); border: none; border-radius: var(--radius);
    color: var(--navy); font-size: .82rem; font-weight: 700;
    cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .btn-decline {
    padding: 9px 20px;
    background: transparent; border: 1px solid var(--line-2); border-radius: var(--radius);
    color: var(--text-3); font-size: .82rem; font-weight: 600;
    cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .action-resolved { font-size: .82rem; color: var(--text-3); font-style: italic; }

  /* Document list */
  .doc-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    background: var(--navy-3);
    border-radius: var(--radius);
    margin-bottom: 8px;
    gap: 12px;
  }
  .doc-icon { font-size: 1.1rem; flex-shrink: 0; }
  .doc-info { flex: 1; min-width: 0; }
  .doc-name { font-size: .9rem; font-weight: 500; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-meta { font-size: .72rem; color: var(--text-4); margin-top: 2px; }
  .btn-dl {
    padding: 6px 14px;
    background: transparent; border: 1px solid var(--line); border-radius: var(--radius);
    color: var(--teal); font-size: .75rem; font-weight: 600;
    cursor: pointer; font-family: 'Inter', sans-serif; text-decoration: none;
    white-space: nowrap; transition: background .2s;
  }
  .btn-dl:hover { background: var(--teal-lt); }

  /* Updates feed */
  .update-row { padding: 14px 0; border-bottom: 1px solid var(--line-2); }
  .update-row:last-child { border-bottom: none; }
  .update-meta { font-size: .75rem; color: var(--text-4); margin-bottom: 5px; }
  .update-text { font-size: .9rem; color: var(--text-2); line-height: 1.65; }

  .panel-empty { font-size: .9rem; color: var(--text-3); line-height: 1.65; }

  .loading-msg { text-align: center; padding: 60px 24px; color: var(--text-3); font-size: .95rem; }

  @media (max-width: 640px) {
    .topbar { padding: 0 20px; }
    .page { padding: 28px 20px 60px; }
    .page-hero { flex-direction: column; align-items: flex-start; }
    .case-card { grid-template-columns: 1fr; }
    .card-right { flex-direction: row; align-items: center; }
  }
</style>
</head>
<body>

<nav class="topbar">
  <a class="topbar-logo" href="https://elkinvestigations.com" title="Home — ELK Investigations" style="text-decoration:none;">
    <div class="logo-mark">ELK</div>
    <div class="logo-text">
      <div class="firm">ELK Investigations LLC</div>
      <div class="sub">⌂ Home · Client Portal</div>
    </div>
  </a>
  <div class="topbar-right">
    <span class="greeting">Welcome, <strong id="clientNameTop">—</strong></span>
    <button class="btn-logout" onclick="logout()">Sign Out</button>
  </div>
</nav>

<div class="page">

  <!-- Hero -->
  <div class="page-hero">
    <div>
      <h1 id="pageHeading">My Cases</h1>
      <p>Track status, review updates, and access your documents.</p>
    </div>
    <a href="/onboard" class="btn-new-case">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 2v12M2 8h12"/></svg>
      Open a New Case
    </a>
  </div>

  <!-- Summary stats -->
  <div class="summary-row" id="summaryRow" style="display:none;">
    <div class="summary-card">
      <div class="summary-label">Total Cases</div>
      <div class="summary-value" id="statTotal">—</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Active</div>
      <div class="summary-value teal" id="statActive">—</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Actions Needed</div>
      <div class="summary-value gold" id="statActions">—</div>
    </div>
  </div>

  <!-- Cases list -->
  <div class="section-label">Cases</div>
  <div id="casesList" class="cases-list">
    <div class="loading-msg">Loading your cases…</div>
  </div>

</div>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="closePanel()"></div>

<!-- Detail panel -->
<div class="panel" id="panel">
  <div class="panel-head">
    <div>
      <div class="panel-head-num" id="pNum"></div>
      <div class="panel-head-title" id="pTitle"></div>
    </div>
    <button class="btn-close" onclick="closePanel()" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4l12 12M16 4L4 16"/>
      </svg>
    </button>
  </div>
  <div class="panel-body" id="pBody">
    <div class="loading-msg">Loading…</div>
  </div>
</div>

<script>
/* ── helpers ── */
function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d + (d.includes('T') ? '' : 'Z')).toLocaleDateString('en-US',
    { month: 'short', day: 'numeric', year: 'numeric' });
}
function statusLabel(s) {
  return { active:'Active', intake:'Intake', retainer_signed:'Retainer Signed',
           closed:'Closed', pending:'Pending', complete:'Complete' }[s] || s;
}
function badgeClass(s) {
  return { active:'badge-active', intake:'badge-intake', retainer_signed:'badge-signed',
           closed:'badge-closed', pending:'badge-pending' }[s] || 'badge-pending';
}
function caseTypeLabel(t) {
  return { surveillance:'Surveillance', background:'Background Check',
           locate:'Locate / Skip Trace', domestic:'Domestic',
           corporate:'Corporate', attorney:'Attorney Referral',
           general:'General Investigation' }[t]
         || (t ? t.charAt(0).toUpperCase() + t.slice(1) : 'Investigation');
}

/* ── load dashboard ── */
async function load() {
  try {
    const r = await fetch('/case/api/dashboard');
    if (r.status === 401) { window.location.href = '/'; return; }
    const d = await r.json();
    document.getElementById('clientNameTop').textContent = d.client.name;
    const firstName = d.client.name.split(' ')[0];
    document.getElementById('pageHeading').textContent = `Welcome, ${firstName}`;
    renderStats(d.cases);
    renderCases(d.cases);
  } catch {
    document.getElementById('casesList').innerHTML =
      '<p style="color:var(--text-3);padding:24px;">Could not load cases. Please refresh the page.</p>';
  }
}

function renderStats(cases) {
  const active = cases.filter(c => c.status === 'active' || c.status === 'intake' || c.status === 'retainer_signed').length;
  const actions = cases.reduce((n, c) => n + (c.pending_approvals || 0), 0);
  document.getElementById('statTotal').textContent = cases.length;
  document.getElementById('statActive').textContent = active;
  document.getElementById('statActions').textContent = actions;
  if (cases.length) document.getElementById('summaryRow').style.display = 'grid';
}

function renderCases(cases) {
  const el = document.getElementById('casesList');
  if (!cases.length) {
    el.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📂</div>
        <h3>No Cases Yet</h3>
        <p>When you open a case with ELK Investigations, it will appear here.</p>
        <a href="/onboard" class="btn-new-case">Open Your First Case</a>
      </div>`;
    return;
  }
  el.innerHTML = cases.map(c => {
    const hasAction = (c.pending_approvals || 0) > 0;
    return `
    <div class="case-card ${hasAction ? 'has-action' : ''}" onclick="openCase('${c.id}')">
      <div>
        <div class="case-num">${esc(c.case_number)}</div>
        <div class="case-title">${caseTypeLabel(c.case_type)}</div>
        <div class="case-meta-row">
          <span>📅 Opened ${fmtDate(c.created_at)}</span>
          ${c.doc_count ? `<span>📁 ${c.doc_count} document${c.doc_count > 1 ? 's' : ''}</span>` : ''}
        </div>
        ${c.latest_update ? `
          <div class="case-update-preview">
            <span class="update-prefix">Latest Update</span>
            ${esc(c.latest_update)}
          </div>` : ''}
      </div>
      <div class="card-right">
        <span class="badge ${badgeClass(c.status)}">${statusLabel(c.status)}</span>
        ${hasAction ? `<span class="action-alert">⚡ Action Needed</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

/* ── open detail panel ── */
async function openCase(id) {
  document.getElementById('overlay').style.display = 'block';
  document.getElementById('panel').classList.add('open');
  document.getElementById('pBody').innerHTML = '<div class="loading-msg">Loading case details…</div>';
  document.getElementById('pNum').textContent = '';
  document.getElementById('pTitle').textContent = '';

  try {
    const r = await fetch(`/case/api/case/${id}`);
    if (!r.ok) throw new Error();
    const d = await r.json();
    renderPanel(d);
  } catch {
    document.getElementById('pBody').innerHTML = '<p style="color:var(--text-3);">Could not load this case. Please try again.</p>';
  }
}

function renderPanel(d) {
  const c = d.case;
  document.getElementById('pNum').textContent = c.case_number;
  document.getElementById('pTitle').textContent = caseTypeLabel(c.case_type);

  let html = `
    <div class="p-section">
      <div class="status-line">
        <span class="badge ${badgeClass(c.status)}">${statusLabel(c.status)}</span>
        <span style="font-size:.82rem;color:var(--text-4);">Opened ${fmtDate(c.created_at)}</span>
      </div>
    </div>`;

  /* Pending approvals */
  const pending = (d.approvals || []).filter(a => !a.client_response);
  if (pending.length) {
    html += `<div class="p-section">
      <div class="p-sec-title">⚡ Action Required</div>
      ${pending.map(a => `
        <div class="action-card" id="ap-${a.id}">
          <h4>${esc(a.title)}</h4>
          ${a.description ? `<p>${esc(a.description)}</p>` : ''}
          <div class="action-btns">
            <button class="btn-approve" onclick="respond('${a.id}','approve')">Approve</button>
            <button class="btn-decline" onclick="respond('${a.id}','decline')">Decline</button>
          </div>
        </div>`).join('')}
    </div>`;
  }

  /* Documents */
  const docs = (d.documents || []).filter(doc => doc.client_visible);
  if (docs.length) {
    html += `<div class="p-section">
      <div class="p-sec-title">📁 Documents</div>
      ${docs.map(doc => `
        <div class="doc-row">
          <div class="doc-icon">📄</div>
          <div class="doc-info">
            <div class="doc-name">${esc(doc.label || doc.filename)}</div>
            <div class="doc-meta">${doc.doc_type} · ${fmtDate(doc.created_at)}</div>
          </div>
          <a class="btn-dl" href="/case/api/doc/${doc.id}/download" target="_blank">Download</a>
        </div>`).join('')}
    </div>`;
  }

  /* Updates */
  const updates = (d.updates || []).filter(u => u.visible_to_client);
  if (updates.length) {
    html += `<div class="p-section">
      <div class="p-sec-title">📋 Case Updates</div>
      ${updates.map(u => `
        <div class="update-row">
          <div class="update-meta">${fmtDate(u.created_at)} · ${esc(u.posted_by)}</div>
          <div class="update-text">${esc(u.message)}</div>
        </div>`).join('')}
    </div>`;
  }

  if (!pending.length && !docs.length && !updates.length) {
    html += `<p class="panel-empty">No updates yet. ELK Investigations will post updates here as your case progresses. You'll receive a notification when something is added.</p>`;
  }

  document.getElementById('pBody').innerHTML = html;
}

async function respond(approvalId, action) {
  const el = document.getElementById(`ap-${approvalId}`);
  if (el) el.style.opacity = '.5';
  try {
    const r = await fetch(`/case/api/approval/${approvalId}/respond`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ response: action })
    });
    if (r.ok) {
      if (el) {
        el.innerHTML = `<div class="action-resolved">${action === 'approve' ? '✓ Approved' : '✕ Declined'} — thank you.</div>`;
        el.style.opacity = '1';
      }
      load();
    }
  } catch {
    if (el) el.style.opacity = '1';
  }
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').style.display = 'none';
}

async function logout() {
  try { await fetch('/auth/logout', { method: 'POST' }); } catch (_) {}
  window.location.href = 'https://elkinvestigations.cloudflareaccess.com/cdn-cgi/access/logout';
}

load();
</script>
</body>
</html>
